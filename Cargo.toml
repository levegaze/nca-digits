[package]
name = "nca-digits"
version = "0.1.0"
edition = "2024"
default-run = "nca-digits" # plain `cargo run` uses the CLI, not the viz binary

[dependencies]
ndarray      = "0.16.1"
ndarray-rand = "0.15.0"
rand         = "0.8.5"
rayon        = "1.12.0"
macroquad    = { version = "0.4", optional = true }

[features]
viz = ["macroquad"] # macroquad stays out of the training build unless requested

# Visualizer binary — only compiles with `--features viz`.
[[bin]]
name = "viz"
required-features = ["viz"]

[profile.release]
opt-level = 3
lto       = true
